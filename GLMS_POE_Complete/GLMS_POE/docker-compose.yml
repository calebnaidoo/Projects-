version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# GLMS Docker Compose — 3-Container Architecture
#
#   Container 1: sql-server-db      SQL Server 2022 database
#   Container 2: glms-backend-api   ASP.NET Core Web API (talks to DB)
#   Container 3: glms-frontend-web  ASP.NET Core MVC App (talks to API only)
#
# Run: docker compose up --build
# MVC:    http://localhost:5000
# Swagger: http://localhost:5001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # CONTAINER 1: SQL Server Database
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd",
             "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # CONTAINER 2: GLMS Web API (backend service layer)
  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__DefaultConnection: >-
        Server=sql-server-db,1433;Database=GLMS_POE_Api_Db;User Id=sa;
        Password=YourStrong@Passw0rd;TrustServerCertificate=True;
        MultipleActiveResultSets=true
      Jwt__Key:    "GLMSTechMoveSecretKey_SuperSecure_2024_Enterprise_Grade!"
      Jwt__Issuer: "https://glms-api"
      ExchangeRateApi__ApiKey:  "d3bb6db33ca5a2a048e608af"
      ExchangeRateApi__BaseUrl: "https://v6.exchangerate-api.com/v6"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-network
    restart: on-failure

  # CONTAINER 3: GLMS MVC Frontend (presentation layer — zero DB access)
  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: >-
        Server=sql-server-db,1433;Database=GLMS_POE_Db;User Id=sa;
        Password=YourStrong@Passw0rd;TrustServerCertificate=True;
        MultipleActiveResultSets=true
      ApiSettings__BaseUrl: "http://glms-backend-api:5001/"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network
    restart: on-failure

volumes:
  sqlserver_data:
    driver: local

networks:
  glms-network:
    driver: bridge
