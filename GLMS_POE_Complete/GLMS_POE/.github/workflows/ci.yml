name: GLMS CI/CD Pipeline

# Runs on every push and pull request to main/master/develop
# This is the automated testing in CI/CD for Part 3

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build and Run All Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore GLMS_POE.sln

      - name: Build solution (Release)
        run: dotnet build GLMS_POE.sln --configuration Release --no-restore

      - name: Run all unit and integration tests
        run: |
          dotnet test GLMS.Tests/GLMS.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=TestResults.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: GLMS Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload code coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

  docker-build-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build --file GLMS.API/Dockerfile --tag glms-backend-api:ci .

      - name: Build Web Docker image
        run: docker build --file GLMS.Web/Dockerfile --tag glms-frontend-web:ci .

      - name: Validate docker-compose.yml
        run: docker compose config
